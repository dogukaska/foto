<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Görsel Gizle · Dijital Çakı</title>
<meta name="theme-color" content="#efede8">
<link rel="icon" href="/icons/dijital-caki.svg">
<link rel="stylesheet" href="/tool.css?v=20261126b">
<script src="/theme.js?v=20261125d"></script>
<script type="module" src="app.js"></script>
</head>
<body><main class="tool">
<header><a class="back" href="/foto/">Araçlara dön</a>
<h1>Görsel Gizle</h1><p class="intro">Paylaşmadan önce hassas alanları kapat ve yeni PNG indir.</p></header>
<section class="panel">
<label for="file">Görsel seç</label><input id="file" type="file" accept="image/*,.heic,.heif"><p id="status" role="status"></p>
<div id="editor" hidden><div class="row"><button id="redact" aria-pressed="true">Alanı kapat</button><button id="crop" aria-pressed="false">Kırp</button>
<button id="undo" disabled>Geri al</button><button id="download" class="primary" disabled>PNG indir</button></div>
<p>Önizlemede bir dikdörtgen çiz. İstersen piksel koordinatlarını elle gir.</p>
<canvas id="preview" style="touch-action:none;cursor:crosshair" aria-label="Görsel önizlemesi"></canvas>
<form id="rect" class="row"><label>X<input id="x" type="number" min="0" value="0" required></label><label>Y<input id="y" type="number" min="0" value="0" required></label>
<label>Genişlik<input id="w" type="number" min="1" value="1" required></label><label>Yükseklik<input id="h" type="number" min="1" value="1" required></label>
<button>Alanı uygula</button></form></div></section>
</main></body></html>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fotoğrafları Birleştir · Dijital Çakı</title>
<link rel="icon" href="/icons/dijital-caki.svg">
<link rel="stylesheet" href="/tool.css?v=20261126d">
<link rel="stylesheet" href="/gunluk/style.css?v=1">
<link rel="stylesheet" href="./style.css?v=1">
<script src="/theme.js?v=20261126c"></script>
<script type="module" src="./app.js?v=1"></script>
</head>
<body>
<main class="tool daily collage">
  <header>
    <a class="back" href="/#foto">Uygulamalar</a>
    <h1>Fotoğrafları Birleştir</h1>
    <p class="intro">Fotoğrafları yan yana, alt alta ya da ızgarada tek görsele dönüştür.</p>
  </header>
  <section class="panel">
    <label for="files">2–12 fotoğraf seç</label>
    <input id="files" type="file" multiple accept="image/*,.heic,.heif">
    <ol id="images" class="clean" aria-label="Fotoğraf sırası" hidden></ol>
  </section>
  <p id="status" role="status"></p>
  <section id="work" class="panel" hidden>
    <div class="fields">
      <label>Düzen<select id="layout"><option value="horizontal">Yan yana</option><option value="vertical">Alt alta</option><option value="grid">Izgara</option></select></label>
      <label id="columns-field" hidden>Sütun<select id="columns"><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label>
      <label>Fotoğraflar arası boşluk (px)<input id="gap" type="number" inputmode="numeric" min="0" max="100" step="1" value="0"></label>
      <label>Çıktı biçimi<select id="format"><option value="jpg">JPG</option><option value="png">PNG</option></select></label>
      <label>Arka plan<select id="background"><option value="#ffffff">Beyaz</option><option value="#2e3033">Antrasit</option><option id="transparent" value="transparent" hidden disabled>Şeffaf</option></select></label>
    </div>
    <p id="dimensions" class="muted"></p>
    <canvas id="preview" aria-label="Birleştirilmiş fotoğraf önizlemesi" role="img"></canvas>
    <div class="row"><button id="download" type="button" class="primary">Görseli indir</button></div>
  </section>
</main>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fotoğraf Baskı Boyutu · Dijital Çakı</title>
<link rel="icon" href="/icons/dijital-caki.svg">
<link rel="stylesheet" href="/tool.css?v=20261126d">
<link rel="stylesheet" href="/gunluk/style.css?v=1">
<script src="/theme.js?v=20261126c"></script>
<script type="module" src="./app.js?v=1"></script>
</head>
<body>
<main class="tool daily">
<header>
  <a class="back" href="/#foto">Uygulamalar</a>
  <h1>Fotoğraf Baskı Boyutu</h1>
  <p class="intro">Piksel ölçüsünden baskı boyutunu veya baskı boyutundan gerekli piksel sayısını bul.</p>
</header>
<form id="print-form" class="panel">
  <label for="mode">İşlem</label>
  <select id="mode">
    <option value="print">Pikselden baskı ölçüsüne</option>
    <option value="pixels">Baskı ölçüsünden piksele</option>
  </select>
  <div id="upload">
    <label for="image">Piksel ölçülerini fotoğraftan al (isteğe bağlı)</label>
    <input id="image" type="file" accept="image/*,.heic,.heif">
  </div>
  <div class="fields">
    <label for="width"><span id="width-label">En (px)</span><input id="width" type="text" inputmode="numeric" maxlength="12" required></label>
    <label for="height"><span id="height-label">Boy (px)</span><input id="height" type="text" inputmode="numeric" maxlength="12" required></label>
    <label for="ppi">Çözünürlük (PPI)<input id="ppi" type="number" min="1" max="10000" value="300" required></label>
  </div>
  <p class="muted">PPI, baskıda bir inçe düşen piksel sayısıdır.</p>
  <div class="row"><button class="primary">Hesapla</button></div>
</form>
<p id="status" role="status"></p>
</main>
</body>
</html>

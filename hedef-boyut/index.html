<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hedef Boyuta Küçült · Dijital Çakı</title>
<meta name="theme-color" content="#efede8">
<link rel="icon" href="/icons/dijital-caki.svg">
<link rel="stylesheet" href="/tool.css?v=20261126b">
<script src="/theme.js?v=20261125d"></script>
<script type="module" src="app.js"></script>
</head>
<body><main class="tool">
<header><a class="back" href="/foto/">Araçlara dön</a>
<h1>Hedef Boyuta Küçült</h1><p class="intro">Bir kilobayt sınırı ver. Görsel, sınırı karşılayacak şekilde küçültülür.</p></header>
<section class="panel"><label for="file">Görsel seç</label><input id="file" type="file" accept="image/*,.heic,.heif">
<div class="row"><label>En büyük dosya boyutu (KB)<input id="limit" type="number" min="1" max="10000" value="500"></label>
<label>Çıktı biçimi<select id="format"><option value="jpg">JPG</option><option value="webp">WebP</option></select></label></div>
<div class="row"><button id="run" class="primary" disabled>Küçült</button><button id="download" disabled>İndir</button></div>
<p id="status" role="status"></p><img id="preview" alt="Küçültülmüş görsel" hidden></section>
</main></body></html>

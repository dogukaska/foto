<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Görsel Paylaş · Dijital Çakı</title>
<link rel="icon" href="/icons/dijital-caki.svg">
<link rel="stylesheet" href="/tool.css?v=20261126d">
<link rel="stylesheet" href="style.css?v=1">
<script src="/theme.js?v=20261126c"></script>
<script type="module" src="app.js?v=3"></script>
</head>
<body>
<main class="tool image-share">
<header>
  <a class="back" href="/#foto">Uygulamalar</a>
  <h1>Görsel Paylaş</h1>
  <p class="intro" id="intro">Görselleri kalite kaybı olmadan tek bağlantı veya QR kodla gönder.</p>
</header>
<section id="sender" class="panel" hidden>
  <label for="picture">Görselleri seç · toplam 100 MB</label>
  <input id="picture" type="file" multiple accept=".jpg,.jpeg,.png,.gif,.webp,.avif,.heic,.heif,.bmp,.tif,.tiff">
  <p id="file-info" class="intro" hidden></p>
  <label for="expiry">Bağlantı süresi</label>
  <select id="expiry"><option value="1">1 saat</option><option value="6">6 saat</option><option value="24" selected>24 saat</option><option value="48">48 saat</option></select>
  <div class="row">
    <button id="start" type="button" class="primary" disabled>Yükle ve bağlantı oluştur</button>
    <button id="cancel" type="button" hidden>İptal et</button>
  </div>
  <p class="intro">Kişisel paylaşımlar için. Görseller tarayıcıda şifrelenir ve geçici olarak TempFile.org’da saklanır.</p>
  <p class="intro">Büyük dosyalar için <a href="/dosya/paylas/">Dosya Paylaş</a> · gönderi başına 50 GB</p>
</section>
<section id="share" class="panel" hidden>
  <label for="link">Paylaşım bağlantısı</label>
  <input id="link" type="url" readonly spellcheck="false">
  <div class="row">
    <button id="copy" type="button" class="primary">Bağlantıyı kopyala</button>
    <button id="native-share" type="button" hidden>Paylaş</button>
    <button id="save-qr" type="button">QR indir</button>
    <button id="end" type="button">Bağlantıyı sil</button>
  </div>
  <p id="expires" class="intro"></p>
  <canvas id="qr" role="img" aria-label="Paylaşım bağlantısının QR kodu"></canvas>
</section>
<section id="receiver" class="panel" hidden>
  <button id="receive" type="button" class="primary">Görseli al</button>
  <button id="save" type="button" class="primary" hidden>Orijinal görseli indir</button>
  <button id="save-zip" type="button" class="primary" hidden>Tümünü ZIP olarak indir</button>
  <ul id="received-files" class="row" hidden></ul>
  <p class="intro">Dosyanın şifresi bu tarayıcıda açılır.</p>
</section>
<p id="status" role="status" aria-live="polite"></p>
<progress id="progress" max="100" value="0" aria-label="Aktarım ilerlemesi" hidden></progress>
<noscript>Görsel paylaşımı için JavaScript gerekli.</noscript>
</main>
</body>
</html>
